<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | Panchayat Weather Intelligence</title>
  <meta name="description" content="The page you requested was not found. Return to Panchayat Weather Intelligence to explore block-level weather downscaling, validation and crop advisory." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/website/favicon.svg" />
  <style>
    :root {
      --navy: #0f2c4d;
      --ink: #1b2a3a;
      --muted: #5a6b7e;
      --line: #d9e2ec;
      --surface: #ffffff;
      --bg: #f4f7fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.55;
    }
    .card {
      max-width: 640px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(15, 44, 77, 0.08);
    }
    .code {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 { margin: 12px 0 10px; font-size: clamp(1.6rem, 4vw, 2.1rem); color: var(--navy); }
    p { margin: 0 auto 28px; max-width: 46ch; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    a.button {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid transparent;
    }
    a.primary { background: var(--navy); color: #fff; }
    a.secondary { background: #fff; color: var(--navy); border-color: var(--line); }
    a:focus-visible { outline: 3px solid #f0a01a; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">Error 404</div>
    <h1>Page not found</h1>
    <p>The page you requested does not exist, or it has moved. No weather data was affected.</p>
    <div class="actions">
      <a class="button primary" href="/">Back to Home</a>
      <a class="button secondary" href="/app">Explore Weather Intelligence</a>
    </div>
  </main>
</body>
</html>
